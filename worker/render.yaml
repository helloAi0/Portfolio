services:
  - type: web
    name: limo-cert-worker
    runtime: python
    rootDir: worker
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - { key: PORTFOLIO_URL, sync: false }
      - { key: INGEST_SECRET, sync: false }
      - { key: GEMINI_API_KEY, sync: false }
      - { key: GMAIL_USER, sync: false }
      - { key: GMAIL_APP_PASSWORD, sync: false }
